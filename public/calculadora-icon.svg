<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="calcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background / Base squircle -->
  <rect width="512" height="512" rx="112" fill="url(#calcGrad)"/>

  <!-- Subtle grid pattern / industrial accents -->
  <circle cx="440" cy="72" r="16" fill="#60a5fa" opacity="0.3" />
  <circle cx="400" cy="72" r="8" fill="#60a5fa" opacity="0.2" />

  <!-- Calculator Card -->
  <g filter="url(#shadow)">
    <rect x="96" y="80" width="320" height="352" rx="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
    
    <!-- Header display screen -->
    <rect x="124" y="112" width="264" height="76" rx="16" fill="url(#screenGrad)"/>
    <!-- Screen content: numbers and % sign -->
    <text x="144" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="1">CAST 1 • BALANÇO</text>
    <text x="368" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#38bdf8" text-anchor="end">100.00%</text>

    <!-- Keypad Grid (3 columns x 3 rows) -->
    <!-- Row 1 -->
    <rect x="124" y="206" width="76" height="52" rx="12" fill="#f1f5f9" />
    <text x="162" y="239" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#1e293b" text-anchor="middle">A</text>

    <rect x="218" y="206" width="76" height="52" rx="12" fill="#fef3c7" />
    <text x="256" y="239" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#d97706" text-anchor="middle">B</text>

    <rect x="312" y="206" width="76" height="52" rx="12" fill="#dcfce7" />
    <text x="350" y="239" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#16a34a" text-anchor="middle">C</text>

    <!-- Row 2 -->
    <rect x="124" y="272" width="76" height="52" rx="12" fill="#f1f5f9" />
    <text x="162" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#1e293b" text-anchor="middle">D</text>

    <rect x="218" y="272" width="76" height="52" rx="12" fill="#eff6ff" />
    <text x="256" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#2563eb" text-anchor="middle">µm</text>

    <rect x="312" y="272" width="76" height="52" rx="12" fill="#eff6ff" />
    <text x="350" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#2563eb" text-anchor="middle">RPM</text>

    <!-- Row 3: Action key -->
    <rect x="124" y="338" width="264" height="56" rx="14" fill="#2563eb" />
    <text x="256" y="373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">CALCULADORA</text>
  </g>
</svg>
